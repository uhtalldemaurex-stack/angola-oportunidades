<!doctype html><html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Angola Oportunidades{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body>
<header class="header"><div class="brand">🇦🇴 Angola <span>Oportunidades</span></div><nav class="nav"><a href="{{ url_for('home') }}">Início</a>{% if current_user %}<a href="{{ url_for('anunciar') }}">＋ Anunciar</a>{% if current_user.role=='admin' %}<a href="{{ url_for('admin') }}">Painel</a>{% endif %}<a href="{{ url_for('logout') }}">Sair</a>{% else %}<a href="{{ url_for('login') }}">Entrar</a><a href="{{ url_for('register') }}">Criar conta</a>{% endif %}</nav></header>
<div class="container">{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></body></html>
