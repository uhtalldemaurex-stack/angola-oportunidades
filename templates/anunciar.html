{% extends "base.html" %}{% block content %}<article><h1>Publicar anúncio</h1><form method="post" enctype="multipart/form-data"><input name="title" placeholder="Título" required><textarea name="description" placeholder="Descrição" required></textarea><select name="category">{% for c in categories %}<option>{{c}}</option>{% endfor %}</select><select name="province">{% for p in provinces %}<option>{{p}}</option>{% endfor %}</select><input name="price" placeholder="Preço"><input type="file" name="image" accept=".jpg,.jpeg,.png,.webp"><button>Enviar para aprovação</button></form></article>{% endblock %}
