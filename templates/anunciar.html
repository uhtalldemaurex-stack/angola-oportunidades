{% extends "base.html" %}{% block content %}<div class="card"><h1>Publicar anúncio</h1><p>Hospedagem, arrendamento de carros/motas e outras oportunidades.</p><form method="post" enctype="multipart/form-data"><label>Título</label><input class="input" name="title" required><label>Descrição</label><textarea class="input" name="description" rows="6" required></textarea><label>Categoria</label><select name="category">{% for c in categories %}<option>{{c}}</option>{% endfor %}</select><label>Província</label><select name="province">{% for p in provinces %}<option>{{p}}</option>{% endfor %}</select><label>Preço</label><input class="input" name="price" placeholder="Ex.: 35.000 Kz/dia"><label>Foto</label><input class="input" type="file" name="image" accept=".jpg,.jpeg,.png,.webp"><button class="btn red">Enviar para aprovação</button></form></div>{% endblock %}
