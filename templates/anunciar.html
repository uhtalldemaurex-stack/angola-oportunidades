{% extends "base.html" %}{% block title %}Publicar anúncio{% endblock %}{% block content %}<div class="card"><h1>Publicar anúncio</h1><p>O anúncio ficará pendente até ser analisado pelo administrador.</p><form method="post" enctype="multipart/form-data"><label>Título</label><input class="input" name="title" required><label>Descrição</label><textarea class="input" name="description" rows="6" required></textarea><label>Categoria</label><select name="category">{% for c in ['Empregos','Concursos','Bolsas de estudo','Cursos','Motas','Carros','Casas','Telefones','Outros produtos'] %}<option>{{c}}</option>{% endfor %}</select><label>Província</label><input class="input" name="province" required><label>Preço (opcional)</label><input class="input" name="price"><label>Imagem (máx. 5 MB)</label><input class="input" type="file" name="image" accept=".jpg,.jpeg,.png,.webp"><button class="btn red">Enviar para aprovação</button></form></div>{% endblock %}
